name: checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the installer reads allowlisted blobs from a pinned revision
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and installation tests
        run: node --test tests/*.test.mjs
      - name: Offline evaluation cases
        run: node evals/run.mjs run
      - name: Python signal tests
        run: python3 -B -m unittest discover -s signals -p 'test_*.py'
