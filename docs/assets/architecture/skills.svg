<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 530" role="img" aria-label="Six skills, work handoffs and feedback routes"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#73838c"/></marker></defs><style>text{font-family:system-ui,sans-serif;fill:#233941}.node{cursor:pointer}.node:focus rect,.node:hover rect{stroke:#206a70;stroke-width:3}.edge{fill:none;stroke:#73838c;stroke-width:1.8;marker-end:url(#arrow)}.dim{opacity:.16}</style><rect width="100%" height="100%" rx="18" fill="#fff"/><g class="node" data-id="onboard" data-type="text" role="button" tabindex="0" aria-label="Inspect factory-onboard"><rect x="30" y="165" width="185" height="100" rx="12" fill="#e4eff0" stroke="#cad5d7"/><text x="48" y="200" font-size="18" font-weight="650">factory-onboard</text><text x="48" y="227" font-size="13" fill="#5e727b">Local process</text></g><g class="node" data-id="plan" data-type="text" role="button" tabindex="0" aria-label="Inspect factory-plan"><rect x="235" y="165" width="185" height="100" rx="12" fill="#e4eff0" stroke="#cad5d7"/><text x="253" y="200" font-size="18" font-weight="650">factory-plan</text><text x="253" y="227" font-size="13" fill="#5e727b">Intent &amp; criteria</text></g><g class="node" data-id="deliver" data-type="text" role="button" tabindex="0" aria-label="Inspect factory-deliver"><rect x="440" y="165" width="185" height="100" rx="12" fill="#e4eff0" stroke="#cad5d7"/><text x="458" y="200" font-size="18" font-weight="650">factory-deliver</text><text x="458" y="227" font-size="13" fill="#5e727b">Change + evidence</text></g><g class="node" data-id="verify" data-type="text" role="button" tabindex="0" aria-label="Inspect factory-verify"><rect x="645" y="165" width="185" height="100" rx="12" fill="#e4eff0" stroke="#cad5d7"/><text x="663" y="200" font-size="18" font-weight="650">factory-verify</text><text x="663" y="227" font-size="13" fill="#5e727b">Checks &amp; findings</text></g><g class="node" data-id="understand" data-type="text" role="button" tabindex="0" aria-label="Inspect factory-understand"><rect x="850" y="165" width="185" height="100" rx="12" fill="#e4eff0" stroke="#cad5d7"/><text x="868" y="200" font-size="18" font-weight="650">factory-understand</text><text x="868" y="227" font-size="13" fill="#5e727b">Explain + discuss</text></g><path class="edge" d="M215 215 H235"/><path class="edge" d="M420 215 H440"/><path class="edge" d="M625 215 H645"/><path class="edge" d="M830 215 H850"/><path class="edge" d="M737 165 V115 H532 V165"/><text x="565" y="104" font-size="12" fill="#5e727b">clear defect → repair</text><path class="edge" d="M942 165 V73 H327 V165"/><text x="430" y="61" font-size="12" fill="#5e727b">missing or changed intent → reconcile the same spec</text><g class="node" data-id="observe" data-type="text" role="button" tabindex="0" aria-label="Inspect factory-observe"><rect x="440" y="365" width="280" height="100" rx="12" fill="#e4eff0" stroke="#cad5d7"/><text x="458" y="400" font-size="18" font-weight="650">factory-observe</text><text x="458" y="427" font-size="13" fill="#5e727b">Status + new messages → bounded nudge</text></g><path class="edge" d="M580 365 V320 H532 V265"/><text x="590" y="310" font-size="12" fill="#5e727b">observe owned work</text></svg>