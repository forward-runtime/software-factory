<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1100" viewBox="0 0 1680 1100"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1L7 4L1 7" fill="none" stroke="#78917b"/></marker><pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r=".7" fill="#dde2d8"/></pattern></defs><rect width="1680" height="1100" fill="#f6f8f2"/><style>text{font-family:Arial,sans-serif}</style><text x="45" y="39" font-size="11" fill="#75836e" font-weight="600">SOFTWARE FACTORY / COMPONENT REVIEW</text><text x="45" y="82" font-size="33" fill="#293b2d" font-weight="600">A portable factory, running on Conductor Cloud.</text><text x="45" y="111" font-size="15" fill="#75836e" font-weight="400">The product is the playbook: roles, skills, prompts, context and evidence. Conductor is the interface and execution platform.</text><rect x="358" y="146" width="1277" height="866" rx="18" fill="url(#dots)" stroke="#cfdbca"/><text x="381" y="176" font-size="11" fill="#75836e" font-weight="600">CONDUCTOR CLOUD ORGANIZATION</text><text x="1173" y="176" font-size="11" fill="#75836e" font-weight="600">PROPOSED SYSTEM · NOT A LIVE RUN</text><rect x="45" y="207" width="276" height="267" rx="13" fill="#eaf0e2" stroke="#d5dfcf"/><text x="65" y="237" font-size="11" fill="#75836e" font-weight="600">A / FRESH PROJECT BOOTSTRAP</text><text x="65" y="272" font-size="20" fill="#293b2d" font-weight="600">Bring the factory over</text><text x="65" y="309" font-size="13" fill="#293b2d" font-weight="400">1. Create a private product repo</text><text x="65" y="334" font-size="13" fill="#293b2d" font-weight="400">2. Create its Conductor section</text><text x="65" y="359" font-size="13" fill="#293b2d" font-weight="400">3. Start cloud workspace / sessions</text><text x="65" y="384" font-size="13" fill="#293b2d" font-weight="400">4. Load the onboarding skill</text><text x="65" y="409" font-size="13" fill="#293b2d" font-weight="400">5. Learn and agree the local process</text><text x="65" y="434" font-size="13" fill="#293b2d" font-weight="400">6. Install the selected components</text><text x="65" y="451" font-size="12" fill="#6e7d67" font-weight="400">Proof: real repo + workspace links</text><path d="M321 350H390" fill="none" stroke="#78917b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="390" y="217" width="530" height="150" rx="13" fill="#fff" stroke="#d5dfcf"/><rect x="407" y="234" width="27" height="25" rx="7" fill="#e8efdf" stroke="none"/><text x="413" y="252" font-size="11" fill="#426343" font-weight="600">01</text><text x="447" y="252" font-size="10" fill="#7a8874" font-weight="600">FACTORY CONTEXT</text><text x="408" y="284" font-size="19" fill="#293b2d" font-weight="600">Shared project context</text><text x="408" y="310" font-size="13" fill="#6e7d67" font-weight="400">Goals, source materials, system map and constraints</text><text x="408" y="332" font-size="13" fill="#6e7d67" font-weight="400">Git-owned spec + project context + original sources</text><rect x="975" y="217" width="620" height="150" rx="13" fill="#fff" stroke="#d5dfcf"/><rect x="992" y="234" width="27" height="25" rx="7" fill="#e8efdf" stroke="none"/><text x="998" y="252" font-size="11" fill="#426343" font-weight="600">04</text><text x="1032" y="252" font-size="10" fill="#7a8874" font-weight="600">NATIVE CONTROLS + OBSERVER PROMPT</text><text x="993" y="284" font-size="19" fill="#293b2d" font-weight="600">Human supervision &amp; observation</text><text x="993" y="310" font-size="13" fill="#6e7d67" font-weight="400">Operator decisions, worker status and actionable blockers</text><text x="993" y="332" font-size="13" fill="#6e7d67" font-weight="400">Use native goals, loops and monitors when exposed</text><path d="M920 287H975" fill="none" stroke="#78917b" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="390" y="462" width="350" height="150" rx="13" fill="#fff" stroke="#d5dfcf"/><rect x="407" y="479" width="27" height="25" rx="7" fill="#e8efdf" stroke="none"/><text x="413" y="497" font-size="11" fill="#426343" font-weight="600">02</text><text x="447" y="497" font-size="10" fill="#7a8874" font-weight="600">FACTORY-PLAN SKILL</text><text x="408" y="529" font-size="19" fill="#293b2d" font-weight="600">Intent &amp; user alignment</text><text x="408" y="555" font-size="13" fill="#6e7d67" font-weight="400">Explore intent, scenarios and tradeoffs together</text><text x="408" y="577" font-size="13" fill="#6e7d67" font-weight="400">One agreed spec + interactive HTML view</text><rect x="806" y="462" width="350" height="150" rx="13" fill="#fff" stroke="#d5dfcf"/><rect x="823" y="479" width="27" height="25" rx="7" fill="#e8efdf" stroke="none"/><text x="829" y="497" font-size="11" fill="#426343" font-weight="600">03</text><text x="863" y="497" font-size="10" fill="#7a8874" font-weight="600">DELIVER + VERIFY SKILLS</text><text x="824" y="529" font-size="19" fill="#293b2d" font-weight="600">Execution &amp; verification</text><text x="824" y="555" font-size="13" fill="#6e7d67" font-weight="400">Isolated Codex / Claude Code workers</text><text x="824" y="577" font-size="13" fill="#6e7d67" font-weight="400">Code, focused tests, independent agent review</text><rect x="1222" y="462" width="373" height="150" rx="13" fill="#fff" stroke="#d5dfcf"/><rect x="1239" y="479" width="27" height="25" rx="7" fill="#e8efdf" stroke="none"/><text x="1245" y="497" font-size="11" fill="#426343" font-weight="600">05</text><text x="1279" y="497" font-size="10" fill="#7a8874" font-weight="600">FACTORY-UNDERSTAND SKILL</text><text x="1240" y="529" font-size="19" fill="#293b2d" font-weight="600">HTML review &amp; understanding</text><text x="1240" y="555" font-size="13" fill="#6e7d67" font-weight="400">Discuss architecture, decisions, code and evidence</text><text x="1240" y="577" font-size="13" fill="#6e7d67" font-weight="400">User questions → clarification → five-question quiz</text><rect x="390" y="658" width="350" height="90" rx="13" fill="#e8efdf" stroke="#ccd9c2"/><text x="408" y="683" font-size="11" fill="#75836e" font-weight="600">USER ALIGNMENT CHECKPOINT</text><text x="408" y="710" font-size="17" fill="#293b2d" font-weight="600">Walk the HTML spec together</text><text x="408" y="732" font-size="11" fill="#6e7d67" font-weight="400">Record decisions before dependent implementation</text><path d="M565 612V658" fill="none" stroke="#78917b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M740 703H774V535H806" fill="none" stroke="#78917b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1156 535H1222" fill="none" stroke="#78917b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M655 367V409H565V462" fill="none" stroke="#78917b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M655 409H981V462" fill="none" stroke="#78917b" stroke-width="1.7" marker-end="url(#arrow)"/><path d="M1285 367V415H981V462" fill="none" stroke="#78917b" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M1285 415H1409V462" fill="none" stroke="#78917b" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="1222" y="658" width="373" height="90" rx="13" fill="#e8efdf" stroke="#ccd9c2"/><text x="1240" y="683" font-size="11" fill="#75836e" font-weight="600">HUMAN CHECKPOINT</text><text x="1240" y="710" font-size="18" fill="#293b2d" font-weight="600">Pass quiz → teammate review</text><text x="1240" y="732" font-size="12" fill="#6e7d67" font-weight="400">Then merge / release under the agreed authority</text><path d="M1409 612V658" fill="none" stroke="#78917b" stroke-width="1.7" marker-end="url(#arrow)"/><rect x="390" y="817" width="1205" height="128" rx="13" fill="#fff" stroke="#d5dfcf"/><text x="410" y="846" font-size="11" fill="#75836e" font-weight="600">06 / ARTIFACTS &amp; TRACEABILITY</text><text x="410" y="878" font-size="20" fill="#293b2d" font-weight="600">Source → requirement → decision → change → checks → explanation → feedback</text><text x="410" y="911" font-size="12" fill="#6e7d67" font-weight="400">Work record: owners and evidence   ·   Git: spec and changes   ·   Project docs: context   ·   Conductor: execution history</text><path d="M565 748V817" fill="none" stroke="#78917b" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M981 612V817" fill="none" stroke="#78917b" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M1409 748V817" fill="none" stroke="#78917b" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M390 878H373V743H1135V367" fill="none" stroke="#78917b" stroke-width="1.7" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="748" y="708" width="413" height="74" rx="13" fill="#f6f8f2" stroke="none"/><text x="767" y="734" font-size="11" fill="#75836e" font-weight="600">FACTORY-OBSERVE SKILL</text><text x="767" y="760" font-size="12" fill="#6e7d67" font-weight="400">Corrections → proposed skill improvement → evaluation</text><rect x="45" y="536" width="276" height="257" rx="13" fill="#fff" stroke="#d5dfcf"/><text x="65" y="565" font-size="11" fill="#75836e" font-weight="600">LEARNED CONNECTIONS</text><text x="65" y="600" font-size="18" fill="#293b2d" font-weight="600">Conversation</text><text x="65" y="623" font-size="12" fill="#6e7d67" font-weight="400">One source / discussion channel</text><text x="65" y="658" font-size="18" fill="#293b2d" font-weight="600">Work queue</text><text x="65" y="681" font-size="12" fill="#6e7d67" font-weight="400">One project board and work queue</text><text x="65" y="716" font-size="18" fill="#293b2d" font-weight="600">Context</text><text x="65" y="739" font-size="12" fill="#6e7d67" font-weight="400">Existing docs and review artifacts</text><text x="65" y="771" font-size="12" fill="#6e7d67" font-weight="400">The project owner connects these.</text><text x="45" y="861" font-size="11" fill="#75836e" font-weight="600">OPTIONAL ENHANCEMENTS</text><text x="45" y="889" font-size="17" fill="#293b2d" font-weight="600">HydraDB</text><text x="45" y="913" font-size="12" fill="#6e7d67" font-weight="400">Connected document / decision retrieval</text><text x="45" y="947" font-size="17" fill="#293b2d" font-weight="600">Vercel</text><text x="45" y="970" font-size="12" fill="#6e7d67" font-weight="400">Generated product previews</text><text x="45" y="1039" font-size="16" fill="#293b2d" font-weight="600">REHEARSAL: local process → scoped agreement → simulated work → explanation and evidence</text><text x="45" y="1070" font-size="12" fill="#75836e" font-weight="400">Solid: work / context flow     Dashed: supervision, evidence and process feedback     Human review waits for the operator; it is not fabricated overnight.</text></svg>